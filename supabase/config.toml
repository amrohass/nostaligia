# Supabase CLI configuration.
#
# Deliberately minimal. This file is read for two very different purposes and only
# one of them is safe right now:
#
#   `supabase db push`      — applies supabase/migrations/ to the linked project.
#                             Safe. This is what item 1 is verified with.
#   `supabase config push`  — overwrites the HOSTED project's auth/API settings with
#                             whatever this file says, filling every key you omitted
#                             with a CLI default. DO NOT RUN IT until this file
#                             describes the project fully (M1, when auth is
#                             configured and the access-token hook is registered).
#
# The project ref below is a public identifier — it is in every API URL the browser
# sends. It is not a credential. No key of any kind belongs in this file; the CLI
# reads SUPABASE_DB_PASSWORD and SUPABASE_ACCESS_TOKEN from the environment, and
# .gitignore keeps every .env out of the repo.

project_id = "pjqvtmhizbnimqyxjbyq"

# The access-token hook from migration 0013. This block configures the LOCAL stack
# only (`supabase start`). The hosted project does not read this file — the hook must
# be switched on by hand at
#   Dashboard → Authentication → Hooks → Customize Access Token (JWT) Claims
#   → Postgres → public.custom_access_token_hook
# until `supabase config push` becomes safe to run (M1).
#
# Nothing in item 4's RLS depends on this hook. Policies read public.authz_role(),
# which goes to the table. The claim exists for Edge Functions and admin-UI
# affordances only — leaving the hook off degrades M1, never M0's authorization.
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

# request-upload (M1). verify_jwt is the CLI default; it is written out because a
# default is not a decision and this one is worth stating.
#
# It is NOT what authenticates the caller. The function hands the same token to
# PostgREST, which verifies the signature itself and derives auth.uid() from it, so an
# anonymous request is refused by the database whatever the gateway did. This line is
# the cheap outer gate: it rejects a garbage token before it costs a Turnstile
# round-trip and two database calls. Deploying with --no-verify-jwt would remove the
# gate and not the guard.
[functions.request-upload]
verify_jwt = true

# complete-upload (M1). Same reasoning as above, and the guard behind it is the same
# shape: begin_ingest derives auth.uid() from the token via PostgREST and refuses a key
# that is not the caller's, so the gateway setting is the cheap outer gate and never the
# thing that decides.
[functions.complete-upload]
verify_jwt = true

# publish (M2), and it is the ONE function that must not verify a JWT — found by the
# lifecycle harness, which got
#
#     401 {"code":"UNAUTHORIZED_INVALID_JWT_FORMAT"}
#
# before a single line of publish/handler.ts ran.
#
# Its caller is pg_net, dispatched from bump_publish_revision, and what it carries is
# PUBLISH_SECRET — a shared secret, not a token. The gateway parses Authorization as a JWT
# and rejects anything that is not one, so with verify_jwt on, the publisher is unreachable
# by its own trigger. That would have shipped: nothing else in the repository calls this
# endpoint, and every unit test calls handleRequest() directly, below the gateway.
#
# Turning the gate off does not widen anything. handler.ts compares the secret in constant
# time and refuses without it, and behind that sits a lease that already refuses a second
# concurrent publish. The alternative — the service-role key as the bearer, so the gateway
# is satisfied — would put a key that opens the whole database in a cron row to save a
# config line, which is the trade §6 exists to refuse.
[functions.publish]
verify_jwt = false

# takedown (M2). Verified, unlike publish: its caller is a moderator's browser with a real
# session, and the guard behind the gate is the role check in the database.
[functions.takedown]
verify_jwt = true
