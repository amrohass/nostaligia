<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ذاكرة رام الله · Ramallah Memory Atlas</title>
<meta name="description" content="أرشيف مجتمعيّ لذاكرة رام الله — صورةً وصوتًا وحكاية. A community archive of Ramallah's memory.">
<!-- Self-hosted, subsetted, unicode-range split (M6, §9). Google Fonts is gone: the CSP
     this project serves blocks it outright, and a font request would hand a third party the
     IP of every reader of a Palestinian heritage archive (§7). Generated by
     scripts/subset-fonts.py, which refuses to write a face whose Arabic stops shaping.
     Preloaded: the 400 Arabic face is on the critical path for an Arabic-first page, and
     `swap` means the alternative is a flash of the system font on every first visit. -->
<link rel="preload" href="/assets/fonts/plex-arabic-400-arabic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/fonts.css">
<link rel="stylesheet" href="/assets/css/tokens.css">
<link rel="stylesheet" href="/assets/css/atlas.css">
</head>
<body>

<a class="sr-only" href="#view">تخطَّ إلى المحتوى</a>

<header class="masthead" id="masthead"></header>

<main id="view"></main>

<footer class="site-footer" id="site-footer"></footer>

<div id="overlays"></div>

<!-- Leaflet and the public OpenStreetMap tile endpoint were loaded here. Both are gone in
     M3. CLAUDE.md §2 forbids the OSM endpoint outright ("NEVER the public OSM tile
     endpoint") and the CSP has blocked unpkg since M0, so the map rendered a blank panel on
     every deployment that actually serves the policy. /map now reads the geo shards §2
     defines and shows located memories as a list — which is M4's own stated fallback — and
     M4 adds the PMTiles basemap on R2 on top of it. -->

<!-- Turnstile (CLAUDE.md §6: on signup and submit). Loaded async and explicitly rendered,
     so the widget appears only in the dialog that needs it rather than on every page view.
     The origin is declared in config/site.json and allowed by script-src and frame-src. -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<!-- Absolute paths, not relative. History API routing (§2) means this same shell is served
     at /item/{id} and /u/{handle} through site/_redirects, where `assets/js/…` would
     resolve against the route rather than the root and 404. The publisher's prerendered
     pages carry the identical list — prerender.ts's SPA_SCRIPTS, which a test pins against
     this file. -->
<script src="/assets/js/config.js"></script>
<script src="/assets/js/i18n.js"></script>
<script src="/assets/js/data.js"></script>
<script src="/assets/js/archive.js"></script>
<script src="/assets/js/ui.js"></script>
<script src="/assets/js/auth.js"></script>
<script src="/assets/js/db.js"></script>
<script src="/assets/js/engage.js"></script>
<script src="/assets/js/turnstile.js"></script>
<script src="/assets/js/upload.js"></script>
<script src="/assets/js/public.js"></script>
</body>
</html>
