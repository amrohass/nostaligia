name: CI

# Every push and every PR. M0's exit criterion is that the denial matrix is green in
# CI — not that it was green on someone's laptop once.
on:
  push:
  pull_request:

# A second push while the first is still running should not race it into the same
# report; cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets ────────────────────────────────────────────────────────────────
  # CLAUDE.md §6, written after a real compromised-key incident. This job is the
  # authority; the pre-commit hook is only a fast local echo of it, and `git commit
  # --no-verify` skips that hook entirely. Runs independently of the database job so a
  # slow Supabase start never delays the answer to "did a key just get pushed".
  secrets:
    name: gitleaks — full history, forbidden paths, rule self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Pinned, and kept in step with scripts/install-gitleaks.ps1 BY HAND. A scanner's
      # rule set changes between releases; if these two drift, the hook and this job
      # disagree about what a clean commit is, and the disagreement is discovered in
      # the worst direction — CI green on rules laxer than the ones run locally.
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v4
        with:
          # THE reason this job exists in this shape. The default fetch-depth of 1
          # scans one commit, so a key committed last week and merged today passes
          # unseen. A secret scanner on a shallow clone is theatre.
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Same origin as the binary, so this catches corruption, not a compromised
          # release. Said plainly rather than labelled "verified".
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Before trusting a result from the scanner, prove the config can still tell a
      # service_role key from an anon key. Same reasoning as the harness probe below:
      # a rule set that matches nothing produces the output of a clean repo.
      #
      # Depends on `pwsh` being preinstalled on the GitHub-hosted Ubuntu image. If that
      # ever stops being true this step fails loudly rather than skipping, which is the
      # acceptable direction — but it is an assumption, not something verified locally.
      - name: Rule self-test — the config still discriminates
        run: pwsh -File scripts/gitleaks-selftest.ps1

      # A force-added .env whose values look innocuous passes a content scan. This is
      # the check that catches it, over every tracked path, using the same pattern
      # file the hook reads.
      - name: No tracked path may look like a credential file
        run: |
          set -euo pipefail
          if hits=$(git ls-files | grep -Ei -f scripts/forbidden-paths.ere); then
            echo "::error::tracked paths matching scripts/forbidden-paths.ere:"
            echo "$hits"
            exit 1
          fi

      # --log-opts=--all scans every ref fetched, not just the tip of this one. On a
      # push with fetch-depth 0 that is the whole repository, which is the point.
      - name: Scan the full history
        run: gitleaks git . -c .gitleaks.toml --redact --no-banner --log-opts=--all

  # ── Front end / headers ────────────────────────────────────────────────────
  # `_headers` and assets/js/config.js are generated from config/site.json. This job is
  # what makes "every origin in one config module" (section 2) true rather than a
  # convention: regenerate, and fail if the committed output differs.
  frontend:
    name: headers, CSP and the external-origin ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generated files match config/site.json
        run: node scripts/build-site-config.mjs --check

      # el() must write styles through CSSOM, and the set of third-party origins must be
      # exactly the one config/site.json declares. Both are things a CSP cannot tell you
      # about by inspection -- and neither shows up locally, because `_headers` is not
      # applied by any local server.
      - name: CSP survivability and origin ratchet
        run: node scripts/frontend-csp-test.mjs

      # Where the session is kept, whether every Edge Function refusal has a message a
      # member can act on, and whether the anon-key guard still tells a service_role key
      # from an anon one. All three fail silently: the session decision is one
      # localStorage.setItem away from being reversed with nothing looking different, and
      # an unmapped refusal reaches a contributor as "something went wrong" over a quota
      # ceiling they would then retry into forever.
      - name: auth, upload refusals and the anon-key guard
        run: node scripts/frontend-auth-test.mjs

  # Gate 1 of request-upload: the refusals that happen before the function touches the
  # network, reads an environment variable or learns who is asking. They need no
  # deployment and no credential, so there is no excuse for them to be untested -- and
  # the test doubles as an ordering assertion, since every request it sends is
  # unauthenticated and would 401 if a gate-1 check ever drifted behind gate 2 or 3.
  functions:
    name: edge function gate 1
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: gate 1, the role floor and the presigner
        run: deno test --allow-env supabase/functions/

      # The unit tests above prove the signature is deterministic and varies with
      # content-length. They cannot prove it is CORRECT -- the only thing to compare
      # against is the code that produced it. MinIO recomputes the signature from the
      # request it receives, so it is an independent verifier of the whole
      # canonicalisation, and it enforces the content-length binding that section 6's
      # quota depends on. Throwaway credentials, no R2 involved.
      - name: SigV4 round-trip against a real S3 implementation
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine && minio server /data"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 2
          done
          deno run --allow-net --allow-env scripts/sigv4-roundtrip.ts

  # ── Media worker ───────────────────────────────────────────────────────────
  # Three tiers, and the split between them is forced by the dev machine having 8 GB of
  # RAM: rung selection is arithmetic and is asserted at 2160 with no file at all, the
  # pipeline runs against a tiny generated clip locally, and the real 4K encode happens
  # here, where the machine belongs to somebody else.
  worker:
    name: media worker — units, the wire, and a real 4K ladder
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests — the front door, the ladder, the failure split
        run: deno test --allow-read --allow-write --allow-env worker/

      # `deno cache` inside the Dockerfile resolves and type-checks the whole module graph,
      # so a broken import fails HERE rather than on the first upload after a deploy, with
      # the row already moved to 'processing'.
      - name: The image builds and its module graph type-checks
        run: docker build -f worker/Dockerfile -t rma-media-worker .

      # LocalStore is three folders and a copyFile; it cannot tell us whether a presigned
      # copy actually moves bytes. MinIO can, and a copy that silently writes nothing loses
      # the archival master while the database says it is there.
      - name: R2Store against a real S3 implementation
        run: |
          docker run -d --name rma-store-minio -p 9002:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine /data/originals /data/public && minio server /data"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9002/minio/health/live && break || sleep 2
          done
          deno run --allow-net --allow-env --allow-read --allow-write \
            worker/scripts/store-roundtrip.ts

      # The 4K path §6 cares about, run inside the image that will be deployed — so it is
      # the container's ffmpeg being tested, not the runner's. Three seconds of 3840x2160
      # generated by lavfi: no fixture in git, and a real encode at the top of the ladder.
      #
      # scripts/ is mounted rather than baked into the image: the production container has
      # no reason to carry a test harness.
      - name: The full ladder at 3840x2160, inside the deployed image
        run: |
          docker run --rm \
            -v "$PWD/worker/scripts:/app/worker/scripts:ro" \
            --entrypoint deno rma-media-worker \
            run --allow-read --allow-write --allow-run --allow-env \
            worker/scripts/ladder-fixture.ts --size 3840x2160 --kind video

      - name: ...and the image and audio pipelines
        run: |
          for k in image audio; do
            docker run --rm \
              -v "$PWD/worker/scripts:/app/worker/scripts:ro" \
              --entrypoint deno rma-media-worker \
              run --allow-read --allow-write --allow-run --allow-env \
              worker/scripts/ladder-fixture.ts --kind "$k" --size 1600x1200
          done

      # CLAUDE.md §11, launch gate 2: "EXIF stripping verified on a real photo carrying GPS
      # data, end to end." Run inside the deployed image, because the thing being verified
      # is what the container's ffmpeg does to an APP1 segment — not what the runner's does.
      #
      # The script also checks itself: it points the same inspection at a file it knows is
      # dirty, and at a run with the re-encode removed. A green here means the checks were
      # awake, not merely quiet.
      - name: §11 gate 2 — GPS EXIF does not reach public/
        run: |
          docker run --rm             -v "$PWD/worker/scripts:/app/worker/scripts:ro"             --entrypoint deno rma-media-worker             run --allow-read --allow-write --allow-run --allow-env             worker/scripts/exif-gate.ts

      - name: Stop MinIO
        if: always()
        run: docker rm -f rma-store-minio || true

  database:
    name: schema, policies and the denial matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # 0.1 — a fresh database, every migration in order. Fails the build on the
      # first migration that does not apply.
      - name: Apply all migrations to a fresh database
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

      # 0.2 — determinism. A migration set that only applies once is not a migration
      # set. This has caught nothing yet; it is here for the day it does.
      - name: Migrations are deterministic
        run: supabase db reset

      # 0.4 — prove the harness BEFORE trusting a single result from it.
      #
      # Two independent failure modes, both of which produce a green suite:
      #   · SET LOCAL ROLE silently not taking effect, so every denial assertion runs
      #     as superuser and passes without testing anything
      #   · pgTAP unable to report a failure at all
      #
      # The probe contains a deliberate failure, so it cannot live in supabase/tests/
      # and cannot be gated on an exit code. It is gated on its output instead.
      - name: Harness probe — the suite can distinguish pass from fail
        run: |
          set -euo pipefail
          out=$(psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')" \
                 -X -q -t -A -f supabase/harness_probe.sql)
          echo "$out"
          grep -qx 'ok 3 - the role switch actually took effect' <<<"$out" \
            || { echo '::error::SET LOCAL ROLE is not taking effect — every denial test is meaningless'; exit 1; }
          grep -q '^not ok 4 ' <<<"$out" \
            || { echo '::error::the harness cannot detect a failing assertion'; exit 1; }
          grep -qx 'ok 2 - pgTAP still works after SET LOCAL ROLE authenticated' <<<"$out" \
            || { echo '::error::pgTAP temp-state collides with SET ROLE'; exit 1; }

      # The suite itself. `supabase test db` runs pg_prove, which parses TAP and exits
      # non-zero on any failed assertion or plan mismatch.
      #
      # This must never become `psql -f`: psql exits 0 even when a pgTAP assertion
      # fails, so the build would pass over a red suite. Confirmed by probe 4, which
      # returns exit 0 while printing `not ok`.
      #
      # And it must not stop at the exit code either. `supabase test db` exits 0 when
      # it runs NOTHING — a renamed directory, a glob that stops matching, a suite
      # that silently shrinks — and a green tick over an empty suite is the exact
      # failure this repository is built to refuse. So the run is gated on the counts
      # pg_prove reports.
      #
      # Both expectations are DERIVED from the test files, never hardcoded: the file
      # count from the glob, the assertion count by summing every plan(N). A literal
      # goes stale the moment a test is added, and it goes stale downward.
      - name: RLS denial matrix and schema integrity
        run: |
          set -euo pipefail
          expect_files=$(ls supabase/tests/*.test.sql | wc -l)
          expect_tests=$(grep -ho 'plan([0-9]\+)' supabase/tests/*.test.sql \
                         | grep -o '[0-9]\+' | awk '{s+=$1} END {print s+0}')
          echo "expecting Files=$expect_files Tests=$expect_tests"

          supabase test db 2>&1 | tee /tmp/tap.out

          summary=$(grep -oE 'Files=[0-9]+, Tests=[0-9]+' /tmp/tap.out | tail -1 || true)
          if [ -z "$summary" ]; then
            echo "::error::pg_prove printed no summary — the suite did not run"
            exit 1
          fi
          got_files=${summary#Files=}; got_files=${got_files%%,*}
          got_tests=${summary##*Tests=}
          echo "got $summary"
          if [ "$got_files" != "$expect_files" ]; then
            echo "::error::ran $got_files test files, expected $expect_files"
            exit 1
          fi
          if [ "$got_tests" != "$expect_tests" ]; then
            echo "::error::ran $got_tests assertions, expected $expect_tests"
            exit 1
          fi

      # §10's M2 exit criterion is "two concurrent approvals produce one consistent release",
      # which needs two backends contending inside open transactions. pgTAP runs in one
      # session and cannot express it; dblink would need a password in the repository. So
      # the race is two psql processes against the running container.
      - name: Two publishers, one lease
        run: bash scripts/publish-race.sh

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # ── The lifecycle harness ──────────────────────────────────────────────────
  # The seams. Every job above tests one component against fakes: request-upload's
  # tests never mint a URL, the worker's never receive one, exif-gate runs the pipeline
  # against a directory. This job is the only place where a presigned URL is actually
  # PUT to, a job is actually verified by the container, and a derivative actually lands
  # in the bucket the database was told about.
  #
  # It is also the ONLY thing that executes `endpoint: r2Endpoint()` at either call site.
  # Comment both out and all 190 unit tests still pass; this job cannot get past check 1.
  #
  # Green here is NOT §11 gate 2 and NOT M1's exit criterion. Both say "end to end",
  # which means real R2 and a deployed worker; this is MinIO on localhost with no CDN
  # anywhere. scripts/lifecycle/run.ts lists the five things it does not prove.
  lifecycle:
    name: the write path, end to end, against a real S3 server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # The GPS fixture is generated, not committed — the same argument ladder-fixture.ts
      # makes. ubuntu-latest carries no ffmpeg.
      - name: ffmpeg, for the fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: MinIO, with the three buckets §2 names
        run: |
          docker run -d --name rma-lifecycle-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine /data/originals /data/public && minio server /data"
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 2
          done

      # R2_ENDPOINT is what makes this job possible at all: without it request-upload
      # signs for <account>.r2.cloudflarestorage.com and the PUT goes nowhere reachable.
      # Written before `supabase start` so the edge runtime picks it up at boot.
      #
      # Untracked, created at runtime, throwaway values. The forbidden-paths job reads
      # `git ls-files`, so a generated .env is not something it can see — and there is
      # nothing here worth seeing.
      - name: Edge Function environment, pointed at MinIO
        run: |
          cat > supabase/functions/.env <<'EOF'
          R2_ENDPOINT=http://127.0.0.1:9000
          R2_ACCOUNT_ID=lifecycle
          R2_ACCESS_KEY_ID=rmatestkey
          R2_SECRET_ACCESS_KEY=rmatestsecret123
          MEDIA_WORKER_URL=http://127.0.0.1:8080
          UPLOAD_ALLOWED_ORIGINS=http://127.0.0.1:3000
          EOF
          # Cloudflare's documented always-pass test secret. request-upload calls the real
          # siteverify endpoint, so this is a live round-trip to Cloudflare that happens to
          # always succeed — not a stub, and not a bypass in the code.
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> supabase/functions/.env
          # Written BEFORE the stack starts, with everything else. The edge runtime reads
          # its environment once at boot, so a variable appended afterwards is a variable
          # complete-upload does not have when it goes to sign a job.
          echo "MEDIA_WORKER_SECRET=lifecycle-worker-secret" >> supabase/functions/.env
          cat supabase/functions/.env

      # The ONLY difference from the database job's invocation: edge-runtime is not in the
      # exclusion list, because this job needs functions served.
      - name: The stack, WITH edge functions
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor,mailpit

      - name: The worker image, as it will be deployed
        run: docker build -f worker/Dockerfile -t rma-media-worker .

      # --network host so the container reaches Kong on 127.0.0.1:54321 and MinIO on
      # 127.0.0.1:9000, both published to the runner's loopback.
      #
      # NOTE, and it is a real limitation: the worker authenticates to PostgREST with the
      # local SERVICE ROLE key rather than a minted media_worker JWT. complete_ingest is
      # granted to both, so the pipeline runs — but this job therefore does NOT exercise
      # the media_worker least-privilege boundary. 16_function_grants.test.sql is what
      # covers that, and it covers it at the database rather than over the wire.
      - name: The worker container
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          docker run -d --name rma-lifecycle-worker --network host \
            -e MEDIA_WORKER_SECRET=lifecycle-worker-secret \
            -e SUPABASE_URL=http://127.0.0.1:54321 \
            -e SUPABASE_ANON_KEY="$ANON_KEY" \
            -e MEDIA_WORKER_JWT="$SERVICE_ROLE_KEY" \
            -e R2_ENDPOINT=http://127.0.0.1:9000 \
            -e R2_ACCOUNT_ID=lifecycle \
            -e R2_ACCESS_KEY_ID=rmatestkey \
            -e R2_SECRET_ACCESS_KEY=rmatestsecret123 \
            -e PORT=8080 \
            rma-media-worker
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && break || sleep 2
          done

      - name: The lifecycle
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL=http://127.0.0.1:54321
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export R2_ENDPOINT=http://127.0.0.1:9000
          export R2_ACCOUNT_ID=lifecycle
          export R2_ACCESS_KEY_ID=rmatestkey
          export R2_SECRET_ACCESS_KEY=rmatestsecret123
          export MEDIA_WORKER_URL=http://127.0.0.1:8080

          # The Actions-specific half, and the reason it is HERE rather than in the script:
          # lifecycle.sh must stay runnable on a laptop with no notion of workflow commands.
          # This turns each failed check into an annotation, which is the only part of a run
          # readable from the API without a token — so a failure can be diagnosed from the
          # run itself rather than by opening the web UI.
          rc=0
          bash scripts/lifecycle.sh 2>&1 | tee lifecycle.out || rc=$?
          if [ "$rc" -ne 0 ]; then
            grep -E '^[[:space:]]*(✗|lifecycle:)' lifecycle.out | while IFS= read -r line; do
              echo "::error title=lifecycle::${line}"
            done
          fi
          exit "$rc"

      - name: Worker logs
        if: failure()
        run: docker logs rma-lifecycle-worker || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f rma-lifecycle-worker rma-lifecycle-minio || true
          supabase stop --no-backup || true
          rm -f supabase/functions/.env
