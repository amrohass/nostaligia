name: CI

# Every push and every PR. M0's exit criterion is that the denial matrix is green in
# CI — not that it was green on someone's laptop once.
on:
  push:
  pull_request:

# A second push while the first is still running should not race it into the same
# report; cancel the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Secrets ────────────────────────────────────────────────────────────────
  # CLAUDE.md §6, written after a real compromised-key incident. This job is the
  # authority; the pre-commit hook is only a fast local echo of it, and `git commit
  # --no-verify` skips that hook entirely. Runs independently of the database job so a
  # slow Supabase start never delays the answer to "did a key just get pushed".
  secrets:
    name: gitleaks — full history, forbidden paths, rule self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Pinned, and kept in step with scripts/install-gitleaks.ps1 BY HAND. A scanner's
      # rule set changes between releases; if these two drift, the hook and this job
      # disagree about what a clean commit is, and the disagreement is discovered in
      # the worst direction — CI green on rules laxer than the ones run locally.
      GITLEAKS_VERSION: 8.30.1

    steps:
      - uses: actions/checkout@v4
        with:
          # THE reason this job exists in this shape. The default fetch-depth of 1
          # scans one commit, so a key committed last week and merged today passes
          # unseen. A secret scanner on a shallow clone is theatre.
          fetch-depth: 0

      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          cd "$(mktemp -d)"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -O "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Same origin as the binary, so this catches corruption, not a compromised
          # release. Said plainly rather than labelled "verified".
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" \
            "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Before trusting a result from the scanner, prove the config can still tell a
      # service_role key from an anon key. Same reasoning as the harness probe below:
      # a rule set that matches nothing produces the output of a clean repo.
      #
      # Depends on `pwsh` being preinstalled on the GitHub-hosted Ubuntu image. If that
      # ever stops being true this step fails loudly rather than skipping, which is the
      # acceptable direction — but it is an assumption, not something verified locally.
      - name: Rule self-test — the config still discriminates
        run: pwsh -File scripts/gitleaks-selftest.ps1

      # A force-added .env whose values look innocuous passes a content scan. This is
      # the check that catches it, over every tracked path, using the same pattern
      # file the hook reads.
      - name: No tracked path may look like a credential file
        run: |
          set -euo pipefail
          # CONTROL, and the same argument the harness probe makes about pgTAP: `grep`
          # finding nothing and `git ls-files` PRODUCING nothing are indistinguishable
          # from this step's exit code, and one of them means the check ran against an
          # empty list. pipefail does not close it either — grep's exit 1 is the rightmost
          # non-zero status, so it wins over a failing git.
          tracked=$(git ls-files | wc -l)
          echo "scanning $tracked tracked paths"
          [ "$tracked" -gt 0 ] || { echo "::error::git ls-files returned nothing — this check would pass over anything"; exit 1; }
          if hits=$(git ls-files | grep -Ei -f scripts/forbidden-paths.ere); then
            echo "::error::tracked paths matching scripts/forbidden-paths.ere:"
            echo "$hits"
            exit 1
          fi

      # --log-opts=--all scans every ref fetched, not just the tip of this one. On a
      # push with fetch-depth 0 that is the whole repository, which is the point.
      - name: Scan the full history
        run: gitleaks git . -c .gitleaks.toml --redact --no-banner --log-opts=--all

  # ── Front end / headers ────────────────────────────────────────────────────
  # `_headers` and assets/js/config.js are generated from config/site.json. This job is
  # what makes "every origin in one config module" (section 2) true rather than a
  # convention: regenerate, and fail if the committed output differs.
  frontend:
    name: headers, CSP and the external-origin ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generated files match config/site.json
        run: node scripts/build-site-config.mjs --check

      # el() must write styles through CSSOM, and the set of third-party origins must be
      # exactly the one config/site.json declares. Both are things a CSP cannot tell you
      # about by inspection -- and neither shows up locally, because `_headers` is not
      # applied by any local server.
      - name: CSP survivability and origin ratchet
        run: node scripts/frontend-csp-test.mjs

      # Where the session is kept, whether every Edge Function refusal has a message a
      # member can act on, and whether the anon-key guard still tells a service_role key
      # from an anon one. All three fail silently: the session decision is one
      # localStorage.setItem away from being reversed with nothing looking different, and
      # an unmapped refusal reaches a contributor as "something went wrong" over a quota
      # ceiling they would then retry into forever.
      - name: auth, upload refusals and the anon-key guard
        run: node scripts/frontend-auth-test.mjs

      # M3. Three things that fail silently and that nothing else can see: a message key
      # that resolves in one language and not the other (I18N.t returns the KEY, so an
      # Arabic reader gets "mine.state.failed" printed where a sentence belongs); a string
      # finding its way back into the DOM as markup, which section 6 calls a defect
      # whatever the call site; and the SPA's module list drifting from the prerendered
      # pages' copy of it, which leaves every shared link hydrating into a half-built page.
      - name: the read path, the XSS sweep, and the lists that must not drift
        run: node scripts/frontend-view-test.mjs

      # The headers the front end SENDS against the ones the preflight GRANTS. A mismatch
      # is invisible to everything else here and to curl -- curl is told the CORS rules and
      # does not enforce them, so the deployed function answered every probe correctly
      # while no browser could reach it. `apikey` was missing from Allow-Headers from M1
      # until 29 Aug 2026, which made uploading impossible on the deployed site and
      # reported it as "no connection".
      - name: the CORS preflight covers what the front end sends
        run: node scripts/frontend-cors-test.mjs

      # M4. Two binary format readers written from the specs — a PMTiles archive and a
      # vector tile — decoding files this test builds byte by byte. Nothing else in the
      # repository can tell whether they are right: a checked-in fixture would make every
      # assertion a comparison between two things nobody can read, and a decoder bug and a
      # bad fixture would look identical. It caught a real one on its first run (a length
      # captured before the varint that advances it), which is a defect whose only symptom
      # is a blank map several fields later.
      - name: the PMTiles reader, the tile decoder and the projection
        run: node scripts/frontend-map-test.mjs

      # §9's budget: "< 150 KB brotli for HTML + CSS + JS + first feed page", and M3's exit
      # criterion says "budget met". Run on every push rather than measured once, because
      # the way a budget is broken is one module at a time by people who each added a small
      # one. Prints the per-file table only when it is over, or with --verbose.
      - name: §9's performance budget
        run: node scripts/frontend-budget.mjs

      # docs/audit-2026-08-31.md was committed holding THREE concatenated copies of itself,
      # the first two cut off mid-sentence, because the sections were assembled by hand
      # across retries and one splice used a `String.replace` whose replacement contained a
      # `$` before a backtick — which expands to everything before the match. Nobody noticed
      # for a commit: a report that is three times too long still reads correctly from the
      # top. The self-test proves the writer refuses to append and refuses a doubled heading;
      # the --check pass then holds every report already in the tree to the same invariant,
      # which is the half that would have caught the original.
      - name: reports are written once, not appended to
        run: |
          node scripts/write-report.mjs --selftest
          for f in docs/*.md; do node scripts/write-report.mjs --check "$f"; done

  # Gate 1 of request-upload: the refusals that happen before the function touches the
  # network, reads an environment variable or learns who is asking. They need no
  # deployment and no credential, so there is no excuse for them to be untested -- and
  # the test doubles as an ordering assertion, since every request it sends is
  # unauthenticated and would 401 if a gate-1 check ever drifted behind gate 2 or 3.
  functions:
    name: edge function gate 1
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --allow-read is new in M3 and is not laziness: prerender.ts carries a DUPLICATE of
      # site/index.html's script and stylesheet lists (a prerendered page is served at
      # /item/{id}, where a relative asset path resolves under the route and 404s), and the
      # only thing that can catch the two drifting is a test that reads the shell.
      # `scripts/` was type-checked by nothing until 29 Aug 2026, and it had two real
      # errors when the check was first run. Both were the same TypeScript 5.7 change --
      # the typed arrays became generic over their buffer, and the default
      # `ArrayBufferLike` admits SharedArrayBuffer, which is neither a BodyInit nor a
      # BufferSource. `deno run` does NOT type-check, so sigv4-roundtrip.ts was being
      # EXECUTED by the step below while carrying an error no job could report.
      #
      # Cheap, and it closes the class rather than the two instances.
      - name: scripts/ type-check
        run: deno check scripts/*.ts scripts/lifecycle/*.ts

      # M5's backup (§11 gate 3). Neither of these can run the real thing in CI — one needs a
      # second Cloudflare account's credentials, the other a scratch Supabase project — so
      # what IS checked is the part that would destroy something if it were wrong: that the
      # dumps are unreadable without the passphrase, that a wrong passphrase THROWS instead of
      # returning rubbish, that a destination in the same account as the source is refused,
      # and that a restore will not run against the production ref. Neither needs a secret,
      # which is why they can run on every push.
      - name: the backup's crypto and its refusals
        run: |
          # --allow-write is for the dir-sink round trip: the self-test writes an encrypted
          # dump into a temp directory and reads it back, which is the SAME read-back the
          # real run does before calling itself a success. It touches nothing else.
          deno run --allow-read --allow-write scripts/backup.ts --selftest
          deno run --allow-read scripts/restore-verify.ts --selftest

      - name: gate 1, the role floor and the presigner
        run: deno test --allow-env --allow-read supabase/functions/

      # The unit tests above prove the signature is deterministic and varies with
      # content-length. They cannot prove it is CORRECT -- the only thing to compare
      # against is the code that produced it. MinIO recomputes the signature from the
      # request it receives, so it is an independent verifier of the whole
      # canonicalisation, and it enforces the content-length binding that section 6's
      # quota depends on. Throwaway credentials, no R2 involved.
      - name: SigV4 round-trip against a real S3 implementation
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine && minio server /data"
          # Deliberately unguarded, unlike the lifecycle job's waits: `sleep` is this loop's
          # last command, so a MinIO that never starts does NOT fail here — it fails on the
          # deno run below, as a connection error. That is an accepted trade, not an
          # oversight: the status is supplied by the command that matters, and the cost is a
          # worse first line in the log rather than a step that cannot fail.
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break || sleep 2
          done
          deno run --allow-net --allow-env scripts/sigv4-roundtrip.ts

  # ── Media worker ───────────────────────────────────────────────────────────
  # Three tiers, and the split between them is forced by the dev machine having 8 GB of
  # RAM: rung selection is arithmetic and is asserted at 2160 with no file at all, the
  # pipeline runs against a tiny generated clip locally, and the real 4K encode happens
  # here, where the machine belongs to somebody else.
  worker:
    name: media worker — units, the wire, and a real 4K ladder
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Unit tests — the front door, the ladder, the failure split
        run: deno test --allow-read --allow-write --allow-env worker/

      # `deno cache` inside the Dockerfile resolves and type-checks the whole module graph,
      # so a broken import fails HERE rather than on the first upload after a deploy, with
      # the row already moved to 'processing'.
      - name: The image builds and its module graph type-checks
        run: docker build -f worker/Dockerfile -t rma-media-worker .

      # LocalStore is three folders and a copyFile; it cannot tell us whether a presigned
      # copy actually moves bytes. MinIO can, and a copy that silently writes nothing loses
      # the archival master while the database says it is there.
      - name: R2Store against a real S3 implementation
        run: |
          docker run -d --name rma-store-minio -p 9002:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine /data/originals /data/public && minio server /data"
          # Unguarded on purpose, same trade as the SigV4 job's wait: a dead MinIO surfaces
          # as a connection error from the store-roundtrip below rather than as a failure
          # here. The step still cannot pass with MinIO down; only the diagnosis is worse.
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9002/minio/health/live && break || sleep 2
          done
          deno run --allow-net --allow-env --allow-read --allow-write \
            worker/scripts/store-roundtrip.ts

      # The 4K path §6 cares about, run inside the image that will be deployed — so it is
      # the container's ffmpeg being tested, not the runner's. Three seconds of 3840x2160
      # generated by lavfi: no fixture in git, and a real encode at the top of the ladder.
      #
      # scripts/ is mounted rather than baked into the image: the production container has
      # no reason to carry a test harness.
      - name: The full ladder at 3840x2160, inside the deployed image
        run: |
          docker run --rm \
            -v "$PWD/worker/scripts:/app/worker/scripts:ro" \
            --entrypoint deno rma-media-worker \
            run --allow-read --allow-write --allow-run --allow-env \
            worker/scripts/ladder-fixture.ts --size 3840x2160 --kind video

      # Two points, so the per-job deadline can be DERIVED rather than guessed.
      #
      # One measurement cannot separate fixed cost (container start, lavfi generation,
      # probing) from marginal cost (wall seconds per source second), and §6's ceiling is a
      # 20-minute master — 400x the correctness fixture. Scaling a single 3-second figure by
      # 400 would be an assumption wearing a number, so this runs the ladder at two lengths
      # and reports both; slope and intercept come out of the pair.
      #
      # Emitted as ::notice:: on purpose: job logs need a token to read, annotations do not,
      # so these numbers are recoverable from the API by whoever does the arithmetic.
      #
      # WHAT IT STILL DOES NOT SETTLE: this runner has 4 vCPU and Cloud Run is --cpu=2, so
      # the extrapolation understates production. That factor is applied in the derivation,
      # not here.
      - name: Ladder throughput at two source lengths
        run: |
          set -euo pipefail
          for d in 3 30; do
            out=$(docker run --rm \
              -v "$PWD/worker/scripts:/app/worker/scripts:ro" \
              --entrypoint deno rma-media-worker \
              run --allow-read --allow-write --allow-run --allow-env \
              worker/scripts/ladder-fixture.ts --size 3840x2160 --kind video --duration "$d")
            echo "$out"
            line=$(echo "$out" | grep '^LADDER ' || true)
            [ -n "$line" ] || { echo "::error::no LADDER line at duration=$d"; exit 1; }
            echo "::notice title=ladder-throughput::$line"
          done

      - name: ...and the image and audio pipelines
        run: |
          for k in image audio; do
            docker run --rm \
              -v "$PWD/worker/scripts:/app/worker/scripts:ro" \
              --entrypoint deno rma-media-worker \
              run --allow-read --allow-write --allow-run --allow-env \
              worker/scripts/ladder-fixture.ts --kind "$k" --size 1600x1200
          done

      # CLAUDE.md §11, launch gate 2: "EXIF stripping verified on a real photo carrying GPS
      # data, end to end." Run inside the deployed image, because the thing being verified
      # is what the container's ffmpeg does to an APP1 segment — not what the runner's does.
      #
      # The script also checks itself: it points the same inspection at a file it knows is
      # dirty, and at a run with the re-encode removed. A green here means the checks were
      # awake, not merely quiet.
      - name: §11 gate 2 — GPS EXIF does not reach public/
        run: |
          docker run --rm             -v "$PWD/worker/scripts:/app/worker/scripts:ro"             --entrypoint deno rma-media-worker             run --allow-read --allow-write --allow-run --allow-env             worker/scripts/exif-gate.ts

      - name: Stop MinIO
        if: always()
        run: docker rm -f rma-store-minio || true

  database:
    name: schema, policies and the denial matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Pinned, not `latest`, for the same two reasons gitleaks is pinned above.
      #
      # Resolving "latest" costs an unauthenticated GitHub API call per job, and run
      # 32352416409 died on exactly that — "Failed to resolve latest Supabase CLI release:
      # rate limit exceeded" — once the lifecycle job made it two calls a run instead of
      # one. Nothing of ours had executed yet.
      #
      # And the reproducibility argument that applies to a secret scanner applies here too:
      # `latest` means the migration suite runs against whatever shipped this morning, so a
      # CLI regression arrives as a red build on an unrelated commit. Moved deliberately.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # 0.1 — a fresh database, every migration in order. Fails the build on the
      # first migration that does not apply.
      - name: Apply all migrations to a fresh database
        run: supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit

      # 0.2 — determinism. A migration set that only applies once is not a migration
      # set. This has caught nothing yet; it is here for the day it does.
      - name: Migrations are deterministic
        run: supabase db reset

      # 0.4 — prove the harness BEFORE trusting a single result from it.
      #
      # Two independent failure modes, both of which produce a green suite:
      #   · SET LOCAL ROLE silently not taking effect, so every denial assertion runs
      #     as superuser and passes without testing anything
      #   · pgTAP unable to report a failure at all
      #
      # The probe contains a deliberate failure, so it cannot live in supabase/tests/
      # and cannot be gated on an exit code. It is gated on its output instead.
      - name: Harness probe — the suite can distinguish pass from fail
        run: |
          set -euo pipefail
          out=$(psql "$(supabase status -o env | grep '^DB_URL=' | cut -d= -f2- | tr -d '"')" \
                 -X -q -t -A -f supabase/harness_probe.sql)
          echo "$out"
          grep -qx 'ok 3 - the role switch actually took effect' <<<"$out" \
            || { echo '::error::SET LOCAL ROLE is not taking effect — every denial test is meaningless'; exit 1; }
          grep -q '^not ok 4 ' <<<"$out" \
            || { echo '::error::the harness cannot detect a failing assertion'; exit 1; }
          grep -qx 'ok 2 - pgTAP still works after SET LOCAL ROLE authenticated' <<<"$out" \
            || { echo '::error::pgTAP temp-state collides with SET ROLE'; exit 1; }

      # The suite itself. `supabase test db` runs pg_prove, which parses TAP and exits
      # non-zero on any failed assertion or plan mismatch.
      #
      # This must never become `psql -f`: psql exits 0 even when a pgTAP assertion
      # fails, so the build would pass over a red suite. Confirmed by probe 4, which
      # returns exit 0 while printing `not ok`.
      #
      # And it must not stop at the exit code either. `supabase test db` exits 0 when
      # it runs NOTHING — a renamed directory, a glob that stops matching, a suite
      # that silently shrinks — and a green tick over an empty suite is the exact
      # failure this repository is built to refuse. So the run is gated on the counts
      # pg_prove reports.
      #
      # Both expectations are DERIVED from the test files, never hardcoded: the file
      # count from the glob, the assertion count by summing every plan(N). A literal
      # goes stale the moment a test is added, and it goes stale downward.
      - name: RLS denial matrix and schema integrity
        run: |
          set -euo pipefail
          expect_files=$(ls supabase/tests/*.test.sql | wc -l)
          expect_tests=$(grep -ho 'plan([0-9]\+)' supabase/tests/*.test.sql \
                         | grep -o '[0-9]\+' | awk '{s+=$1} END {print s+0}')
          echo "expecting Files=$expect_files Tests=$expect_tests"

          # Redirect, not `| tee`. This one is CORRECT today because `set -euo pipefail` is
          # on the first line of this step — but 532f32d is what a copy of this line looks
          # like without it, and there the suite's exit status was eaten by tee and the job
          # could not fail. Removing the pipeline means the status cannot be lost by
          # deleting one unrelated-looking `set` line later.
          rc=0
          supabase test db > /tmp/tap.out 2>&1 || rc=$?
          cat /tmp/tap.out
          if [ "$rc" -ne 0 ]; then
            # The diagnosis as ANNOTATIONS, not only in the log body. The lifecycle job has
            # always done this and it is why a red run there can be read from outside; this
            # step said "pgTAP reported failing assertions" and put the detail in a log that
            # needs admin rights to download.
            #
            # EVERY grep is guarded with `|| true`, and that is the whole reason this block
            # is shaped like this. Under the `set -euo pipefail` on line 1, a grep that
            # matches nothing exits 1 and takes the step down with it — so the first version
            # of this block swallowed the very diagnosis it exists to print, including the
            # summary line below, on exactly the run where a file died before emitting a
            # single `not ok`. That is this repository's recurring defect (a masked pipe
            # exit) written by the person who documents it.
            #
            # The patterns are pg_prove's, not raw TAP's, and that distinction cost a run.
            # pg_prove does not echo `not ok` lines unless it is verbose: it prints
            # "# Failed test 4: '...'" and "…28_gazetteer.test.sql .. Failed 1/18 subtests".
            # A grep for '^not ok' therefore matches nothing on a perfectly ordinary
            # assertion failure — which, unguarded, then killed the step. `not ok` stays in
            # the list because it costs nothing and a future --verbose would emit it.
            #
            # The last patterns are for the case with no assertion result at all: a file
            # that raises a SQL error reports nothing, and "Dubious" plus the ERROR text is
            # the only thing that says what happened.
            # The summary FIRST, then at most nine details: GitHub keeps ten error
            # annotations per step and silently drops the rest, so anything emitted after
            # ten lines of detail is not there when somebody reads the run. A bare `psql:`
            # pattern is what proved that — it matched one "NOTICE: extension pgtap already
            # exists" per test file, filled the quota with noise, and hid the diagnosis
            # completely.
            echo "::error::pgTAP reported failing assertions"
            grep -E '^not ok|# +Failed test|Failed [0-9]+/[0-9]+|Dubious|ERROR:|FATAL:|died|planned [0-9]+ test' /tmp/tap.out \
              | grep -v 'NOTICE:' > /tmp/tap.err || true
            head -9 /tmp/tap.err | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi

          summary=$(grep -oE 'Files=[0-9]+, Tests=[0-9]+' /tmp/tap.out | tail -1 || true)
          if [ -z "$summary" ]; then
            echo "::error::pg_prove printed no summary — the suite did not run"
            exit 1
          fi
          got_files=${summary#Files=}; got_files=${got_files%%,*}
          got_tests=${summary##*Tests=}
          echo "got $summary"
          if [ "$got_files" != "$expect_files" ]; then
            echo "::error::ran $got_files test files, expected $expect_files"
            exit 1
          fi
          if [ "$got_tests" != "$expect_tests" ]; then
            echo "::error::ran $got_tests assertions, expected $expect_tests"
            exit 1
          fi

      # §10's M2 exit criterion is "two concurrent approvals produce one consistent release",
      # which needs two backends contending inside open transactions. pgTAP runs in one
      # session and cannot express it; dblink would need a password in the repository. So
      # the race is two psql processes against the running container.
      - name: Two publishers, one lease
        run: bash scripts/publish-race.sh

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # ── The lifecycle harness ──────────────────────────────────────────────────
  # The seams. Every job above tests one component against fakes: request-upload's
  # tests never mint a URL, the worker's never receive one, exif-gate runs the pipeline
  # against a directory. This job is the only place where a presigned URL is actually
  # PUT to, a job is actually verified by the container, and a derivative actually lands
  # in the bucket the database was told about.
  #
  # It is also the ONLY thing that executes `endpoint: r2Endpoint()` at either call site.
  # Comment both out and all 190 unit tests still pass; this job cannot get past check 1.
  #
  # Green here is NOT §11 gate 2 and NOT M1's exit criterion. Both say "end to end",
  # which means real R2 and a deployed worker; this is MinIO on localhost with no CDN
  # anywhere. scripts/lifecycle/run.ts lists the five things it does not prove.
  lifecycle:
    name: the write path, end to end, against a real S3 server
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Pinned. See the database job for why.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0

      # The GPS fixture is generated, not committed — the same argument ladder-fixture.ts
      # makes. ubuntu-latest carries no ffmpeg.
      - name: ffmpeg, for the fixture
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # One name for MinIO, resolvable from BOTH sides, and this is not cosmetic.
      #
      # R2_ENDPOINT is a single value used by three parties that are not on the same
      # network: request-upload SIGNS a URL for the harness to use (harness is on the
      # runner), while publish and takedown FETCH their own URLs from inside the
      # edge-runtime container. 127.0.0.1 is correct for the first and is the container's
      # own loopback for the other two — which is how the M2 harness first read "the
      # derivative is STILL in the bucket after a takedown": the delete had been sent to
      # nothing at all. The same mistake run 32354171082 made with MEDIA_WORKER_URL.
      #
      # So the container name goes everywhere, and the runner is taught to resolve it to
      # the published port. Docker DNS answers it inside the network; /etc/hosts answers
      # it outside. One string, two correct answers, and no second variable to keep in step.
      - name: MinIO, with the three buckets §2 names
        run: |
          echo "127.0.0.1 rma-lifecycle-minio" | sudo tee -a /etc/hosts > /dev/null
          docker run -d --name rma-lifecycle-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=rmatestkey -e MINIO_ROOT_PASSWORD=rmatestsecret123 \
            --entrypoint sh minio/minio \
            -c "mkdir -p /data/quarantine /data/originals /data/public && minio server /data"
          # The guard matters: `curl && break || sleep 2` makes `sleep` the loop's last
          # command, so a service that never starts leaves this step GREEN. Same defect
          # class as 532f32d — a step that cannot fail — reached by a different route.
          ok=""
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:9000/minio/health/live && ok=1 && break
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::MinIO never became healthy"; exit 1; }

      # R2_ENDPOINT is what makes this job possible at all: without it request-upload
      # signs for <account>.r2.cloudflarestorage.com and the PUT goes nowhere reachable.
      # Written before `supabase start` so the edge runtime picks it up at boot.
      #
      # Untracked, created at runtime, throwaway values. The forbidden-paths job reads
      # `git ls-files`, so a generated .env is not something it can see — and there is
      # nothing here worth seeing.
      - name: Edge Function environment, pointed at MinIO
        run: |
          cat > supabase/functions/.env <<'EOF'
          R2_ENDPOINT=http://rma-lifecycle-minio:9000
          R2_ACCOUNT_ID=lifecycle
          R2_ACCESS_KEY_ID=rmatestkey
          R2_SECRET_ACCESS_KEY=rmatestsecret123
          # A CONTAINER NAME, not 127.0.0.1, and this is the bug run 32354171082 exposed:
          # request-upload and complete-upload run inside the edge-runtime CONTAINER, where
          # 127.0.0.1 is that container's own loopback. The worker was on the host, so
          # complete-upload returned 502 worker_unreachable and every downstream check
          # cascaded. The worker now joins the Supabase network under this name.
          MEDIA_WORKER_URL=http://rma-lifecycle-worker:8080
          UPLOAD_ALLOWED_ORIGINS=http://127.0.0.1:3000
          EOF
          # Cloudflare's documented always-pass test secret. request-upload calls the real
          # siteverify endpoint, so this is a live round-trip to Cloudflare that happens to
          # always succeed — not a stub, and not a bypass in the code.
          echo "TURNSTILE_SECRET_KEY=1x0000000000000000000000000000000AA" >> supabase/functions/.env
          # Written BEFORE the stack starts, with everything else. The edge runtime reads
          # its environment once at boot, so a variable appended afterwards is a variable
          # complete-upload does not have when it goes to sign a job.
          echo "MEDIA_WORKER_SECRET=lifecycle-worker-secret" >> supabase/functions/.env
          # The publisher's door (M2). Throwaway, and the same value the harness sends.
          # CDN_ORIGIN and the Cloudflare purge token are deliberately NOT set: takedown
          # then reports cdn_reason=not_configured, which is the branch the harness asserts
          # — the bytes are deleted and the operator is told a cached copy may survive.
          echo "PUBLISH_SECRET=lifecycle-publish-secret" >> supabase/functions/.env
          # M3. The publisher writes og:url and the canonical link into every prerendered
          # item page, and env("SITE_ORIGIN") THROWS when it is unset — a page whose
          # preview card does not resolve is the failure section 9 calls a growth failure,
          # so there is no default to fall back to. CDN_ORIGIN stays unset, so the pages
          # carry no og:image: that is the honest degradation, and the harness asserts the
          # small-card branch rather than a guessed image host.
          echo "SITE_ORIGIN=https://lifecycle.test" >> supabase/functions/.env
          cat supabase/functions/.env

      # The ONLY difference from the database job's invocation: edge-runtime is not in the
      # exclusion list, because this job needs functions served.
      - name: The stack, WITH edge functions
        run: supabase start -x realtime,storage-api,imgproxy,studio,logflare,vector,supavisor,mailpit

      - name: The worker image, as it will be deployed
        run: docker build -f worker/Dockerfile -t rma-media-worker .

      # ── Who can reach whom, which run 32354171082 got wrong ──
      #
      # Three parties on two networks, and every address below is the one the SPEAKER can
      # resolve rather than the one that reads naturally:
      #
      #   edge runtime → worker   container name on the Supabase network. The functions run
      #                           INSIDE a container, so 127.0.0.1:8080 was that container's
      #                           own loopback and complete-upload got 502 worker_unreachable.
      #   worker → MinIO          container name, same network. MinIO is joined to it below.
      #   worker → PostgREST      Kong's container name and INTERNAL port 8000, not the
      #                           published 54321.
      #   harness → Supabase      127.0.0.1 on the published ports. It runs on the runner.
      #   everyone → MinIO        rma-lifecycle-minio, which docker DNS answers inside the
      #                           network and /etc/hosts answers on the runner. See the MinIO
      #                           step: request-upload only SIGNS, but publish and takedown
      #                           FETCH, so one value has to satisfy both sides.
      #
      # NOTE, a real limitation: the worker authenticates to PostgREST with the local
      # SERVICE ROLE key rather than a minted media_worker JWT. complete_ingest is granted
      # to both, so the pipeline runs — but this job therefore does NOT exercise the
      # media_worker least-privilege boundary. 16_function_grants.test.sql covers that at
      # the database instead.
      - name: The worker container
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          # `eval "$(…)"` cannot fail. A failing `supabase status` leaves sed with nothing
          # to transform, eval runs an empty string, and every variable below expands to ""
          # — so the container starts with no keys, answers /healthz perfectly well, and
          # this step goes GREEN. The failure then surfaces two steps later as a worker
          # that cannot reach PostgREST, which is the most expensive place to find it.
          # Same defect class as 532f32d, reached through a construct `set -e` does not see.
          for v in ANON_KEY SERVICE_ROLE_KEY; do
            [ -n "${!v:-}" ] || { echo "::error::$v is empty — supabase status produced nothing"; exit 1; }
          done
          NET=$(docker inspect "$(docker ps --filter name=supabase_kong --format '{{.Names}}' | head -1)" \
                  --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}}{{end}}')
          KONG=$(docker ps --filter name=supabase_kong --format '{{.Names}}' | head -1)
          [ -n "$NET" ] && [ -n "$KONG" ] || { echo "::error::could not find the Supabase network or Kong"; exit 1; }
          echo "network=$NET kong=$KONG"

          # MinIO was started before this network existed, so it is joined now rather than
          # at creation. It keeps its published port too — the harness still reaches it on
          # 127.0.0.1:9000.
          docker network connect "$NET" rma-lifecycle-minio

          docker run -d --name rma-lifecycle-worker --network "$NET" -p 8080:8080 \
            -e MEDIA_WORKER_SECRET=lifecycle-worker-secret \
            -e SUPABASE_URL="http://$KONG:8000" \
            -e SUPABASE_ANON_KEY="$ANON_KEY" \
            -e MEDIA_WORKER_JWT="$SERVICE_ROLE_KEY" \
            -e R2_ENDPOINT=http://rma-lifecycle-minio:9000 \
            -e R2_ACCOUNT_ID=lifecycle \
            -e R2_ACCESS_KEY_ID=rmatestkey \
            -e R2_SECRET_ACCESS_KEY=rmatestsecret123 \
            -e PORT=8080 \
            rma-media-worker
          # Guarded, same reason as the MinIO wait above: without it a worker that never
          # starts passes this step and surfaces as an unexplained harness failure two
          # steps later, which is the most expensive place to find it.
          ok=""
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/healthz && ok=1 && break
            sleep 2
          done
          [ "$ok" = 1 ] || { echo "::error::the worker never answered /healthz"; docker logs rma-lifecycle-worker || true; exit 1; }

      - name: The lifecycle
        run: |
          eval "$(supabase status -o env | sed 's/^/export /')"
          export SUPABASE_URL=http://127.0.0.1:54321
          export SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export R2_ENDPOINT=http://rma-lifecycle-minio:9000
          export R2_ACCOUNT_ID=lifecycle
          export R2_ACCESS_KEY_ID=rmatestkey
          export R2_SECRET_ACCESS_KEY=rmatestsecret123
          export MEDIA_WORKER_URL=http://127.0.0.1:8080
          export PUBLISH_SECRET=lifecycle-publish-secret

          # The Actions-specific half, and the reason it is HERE rather than in the script:
          # lifecycle.sh must stay runnable on a laptop with no notion of workflow commands.
          # This turns each failed check into an annotation, which is the only part of a run
          # readable from the API without a token — so a failure can be diagnosed from the
          # run itself rather than by opening the web UI.
          # NO PIPELINE HERE, and that is the whole point. This was written as
          #
          #     bash scripts/lifecycle.sh 2>&1 | tee lifecycle.out || rc=$?
          #
          # which returns `tee`'s exit status, not the script's. rc was therefore always 0
          # and this job could not fail. It shipped in f7a40d2 and was caught by pushing a
          # branch with `endpoint: r2Endpoint()` removed at both call sites: the harness
          # died in two seconds instead of running for six minutes, and the job went green
          # anyway. `set -o pipefail` would also fix it; no pipeline at all cannot be got
          # subtly wrong by the next person.
          rc=0
          bash scripts/lifecycle.sh > lifecycle.out 2>&1 || rc=$?
          cat lifecycle.out

          # The count gate, and the reason it exists: a run that stops early records zero
          # failures and is indistinguishable from a run that verified everything. Exactly
          # the argument the database job makes about an empty pgTAP suite.
          #
          # Raised from 20 to 35 when the M2 section landed, and from 35 to 43 when M3's
          # prerendered pages did — 41 fixed assertions plus two per derivative. The floor
          # has to move with the harness or it stops being a floor: the whole publish and
          # takedown section could be deleted and a gate of 20 would still be green.
          ran=$(grep -oE 'LIFECYCLE checks=[0-9]+' lifecycle.out | grep -oE '[0-9]+' || true)
          echo "::notice title=lifecycle::assertions executed: ${ran:-none}"
          if [ "$rc" -eq 0 ] && { [ -z "$ran" ] || [ "$ran" -lt 43 ]; }; then
            echo "::error::lifecycle passed having run only ${ran:-0} assertions — it stopped early"
            rc=1
          fi

          if [ "$rc" -ne 0 ]; then
            grep -E '^[[:space:]]*(✗|lifecycle:)' lifecycle.out | while IFS= read -r line; do
              echo "::error title=lifecycle::${line}"
            done
          fi
          exit "$rc"

      - name: Worker logs
        if: failure()
        run: docker logs rma-lifecycle-worker || true

      - name: Tear down
        if: always()
        run: |
          docker rm -f rma-lifecycle-worker rma-lifecycle-minio || true
          supabase stop --no-backup || true
          rm -f supabase/functions/.env
